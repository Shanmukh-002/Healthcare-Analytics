version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: healthcare_postgres
    restart: always
    environment:
      POSTGRES_DB: healthcare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  etl:
    build: .
    container_name: healthcare_etl
    depends_on:
      - postgres
    env_file:
      - .env.docker
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "
      python etl/generate_data.py &&
      python etl/transform.py &&
      python etl/load.py &&
      python etl/create_views.py
      "

  dashboard:
    build: .
    container_name: healthcare_dashboard
    depends_on:
      - postgres
    env_file:
      - .env.docker
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  pgdata:
